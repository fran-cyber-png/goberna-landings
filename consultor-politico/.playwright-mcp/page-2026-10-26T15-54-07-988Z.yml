            - generic [ref=f9e391]: Activismo político
            - generic [ref=f9e392]: Organización ciudadana, redes y construcción territorial
          - generic [ref=f9e393]: +
        - paragraph [ref=f9e395]: "Pondrás a la ciudadanía en movimiento. Aprenderás a diseñar estrategias de activismo político, construir comunidades digitales, organizar voluntarios, activar causas, generar identificación simbólica y convertir simpatizantes en movilizadores reales. El módulo trabaja el frente indirecto de la campaña: aquel que amplifica el mensaje más allá de la estructura formal del candidato. Se analizarán tribus digitales, ciberactivismo, conversión de simpatizantes, movilización territorial, acciones comunitarias y límites frente al astroturfing o activismo artificial."
      - generic [ref=f9e396]:
        - button "MÓDULO 9 Liderazgo político heroico y estoico Carácter, comunicación y conducción bajo presión +" [ref=f9e397] [cursor=pointer]:
