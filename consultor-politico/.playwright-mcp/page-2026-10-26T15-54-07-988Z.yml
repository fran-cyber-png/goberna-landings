        - paragraph [ref=f9e332]: Iniciarás la simulación desde el primer día. Conformarás tu comando internacional, recibirás un candidato presidencial real y definirás el escenario competitivo que enfrentarás durante todo el diploma. El módulo introduce el campo profesional de la consultoría política, el rol del consultor, las funciones del estratega, la lógica del political management y el modelo de Máquina Electoral GOBERNA. Comprenderás los tres frentes de campaña (oficial, alternativo e indirecto) y cómo estos articulan territorio, comunicación, datos, liderazgo, crisis y movilización. Al finalizar, tu comando tendrá una candidatura definida, roles asignados y una primera lectura estratégica de la competencia.
