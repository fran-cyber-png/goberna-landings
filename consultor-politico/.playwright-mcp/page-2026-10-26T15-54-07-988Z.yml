            - generic [ref=f9e399]: MÓDULO 9
            - generic [ref=f9e400]: Liderazgo político heroico y estoico
            - generic [ref=f9e401]: Carácter, comunicación y conducción bajo presión
          - generic [ref=f9e402]: +
        - paragraph [ref=f9e404]: "Entrenarás al candidato para sostener su liderazgo frente a públicos, medios, rivales y crisis. El módulo trabaja dos dimensiones centrales: el liderazgo heroico, asociado a visión, carisma, propósito y capacidad de inspirar; y el liderazgo estoico, vinculado al temple, autocontrol, carácter y respuesta bajo presión. Practicarás técnicas de oratoria, storytelling, comunicación no verbal, manejo de voz, presencia escénica, debate, vocería y respuesta ante interrupciones hostiles."
      - generic [ref=f9e405]:
        - 'button "MÓDULO 10 Capstone: Proyecto Integral de Campaña Electoral Diseño y ejecución de una estrategia electoral +" [ref=f9e406] [cursor=pointer]':
