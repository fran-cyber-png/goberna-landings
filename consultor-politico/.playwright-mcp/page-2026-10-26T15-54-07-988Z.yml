          - generic [ref=f9e411]: +
        - paragraph [ref=f9e413]: "Integrarás todo lo construido en una sola Máquina Electoral: estrategia, territorio, inteligencia, war room, comunicación, activismo, defensa narrativa, liderazgo, análisis jurídico-político y dirección de campaña. Cada comando presentará su campaña completa ante un jurado internacional de consultores políticos en ejercicio. La sustentación incluirá defensa estratégica, revisión de productos, análisis de decisiones, evaluación del desempeño del comando y respuesta ante un escenario crítico final en vivo."
