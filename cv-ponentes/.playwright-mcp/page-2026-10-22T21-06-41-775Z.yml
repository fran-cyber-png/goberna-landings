        - heading "Resumen ejecutivo" [level=2] [ref=e39]
        - paragraph [ref=e41]: Abogado y político peruano con trayectoria en el Poder Ejecutivo, el Congreso de la República y la lucha anticorrupción. Fue segundo vicepresidente de la República (2011⁠-⁠2012) y congresista durante los periodos 2011⁠-⁠2016 y 2020⁠-⁠2021, habiendo presidido la Comisión de Constitución y Reglamento. Entre 2005 y 2008 trabajó como consultor de la Procuraduría ad hoc Anticorrupción en los casos Fujimori⁠-⁠Montesinos. Su experiencia vincula la reforma constitucional, el derecho penal y el diseño normativo con la institucionalidad y las políticas públicas. Es autor de obras sobre la extradición de Alberto Fujimori y sus memorias de gobierno.
