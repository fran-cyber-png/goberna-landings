      - generic [ref=f2e38]:
        - heading "Resumen ejecutivo" [level=2] [ref=f2e39]
        - paragraph [ref=f2e41]: Gonzalo Catanzariti es licenciado en Seguridad en Tecnologías de la Información y las Comunicaciones y licenciado en Seguridad Marítima. Su trayectoria combina la investigación judicial de ciberdelitos y la informática forense en la Prefectura Naval Argentina con la protección de activos de información en el sector financiero. Desde marzo de 2025 lidera el equipo de Arquitectura de Ciberseguridad de Banco Comafi, supervisando la seguridad de proyectos tecnológicos, entornos cloud, gestión de vulnerabilidades y DevSecOps. Complementa su experiencia con docencia universitaria en ciberseguridad, evidencia digital y herramientas de inteligencia
        - heading "Cargos principales y trayectoria" [level=2] [ref=f2e43]
        - list [ref=f2e45]:
          - listitem [ref=f2e46]:
            - generic [ref=f2e47]: "Líder de Arquitectura de Ciberseguridad — Banco Comafi (desde 2025): conducción de equipos de IT Advisor, Business Advisor y DevSecOps; definición de estándares y supervisión de implementaciones tecnológicas."
          - listitem [ref=f2e48]:
            - generic [ref=f2e49]: "Arquitecto de Ciberseguridad — Banco Comafi (desde 2022): evaluación de proyectos, planificación de pentesting y gestión de vulnerabilidades en API, microservicios y entornos cloud."
          - listitem [ref=f2e50]:
            - generic [ref=f2e51]: "División Investigación de los Ciberdelitos — Prefectura Naval Argentina (desde 2019): intervención en investigaciones judiciales sobre hacking, accesos indebidos y ataques DoS y DDoS."
          - listitem [ref=f2e52]:
            - generic [ref=f2e53]: "Infraestructura de Sistemas — Prefectura Naval Argentina (desde 2016): implementación y mantenimiento de centros de datos, virtualización y almacenamiento."
          - listitem [ref=f2e54]:
            - generic [ref=f2e55]: "Pericias Informáticas — Prefectura Naval Argentina (desde 2013): análisis de elementos sujetos a disposición judicial, preservación de evidencia digital y cadena de custodia."
          - listitem [ref=f2e56]:
            - generic [ref=f2e57]: "Docente — Instituto Universitario de Seguridad Marítima (2019⁠–⁠2026): tecnologías de la información, cibercrimen, evidencia digital, redes, seguridad ofensiva y marcos regulatorios."
          - listitem [ref=f2e58]:
