  - generic [ref=f1e53]:
    - generic [ref=f1e54]:
      - heading "Resumen ejecutivo" [level=2] [ref=f1e57]
      - paragraph [ref=f1e60]: Abogado y político peruano con trayectoria en el Poder Ejecutivo, el Congreso de la República y la lucha anticorrupción. Fue segundo vicepresidente de la República (2011⁠-⁠2012) y congresista durante los periodos 2011⁠-⁠2016 y 2020⁠-⁠2021, habiendo presidido la Comisión de Constitución y Reglamento. Entre 2005 y 2008 trabajó como consultor de la Procuraduría ad hoc Anticorrupción en los casos Fujimori⁠-⁠Montesinos. Su experiencia vincula la reforma constitucional, el derecho penal y el diseño normativo con la institucionalidad y las políticas públicas. Es autor de obras sobre la extradición de Alberto Fujimori y sus memorias de gobierno.
      - heading "Cargos principales y trayectoria" [level=2] [ref=f1e64]
      - list [ref=f1e67]:
        - listitem [ref=f1e68]: Segundo vicepresidente de la República del Perú (2011⁠-⁠2012).
        - listitem [ref=f1e69]: Congresista de la República (2011⁠-⁠2016 y 2020⁠-⁠2021).
        - listitem [ref=f1e70]: Presidente de la Comisión de Constitución y Reglamento del Congreso de la República (2013⁠-⁠2014).
        - listitem [ref=f1e71]: Consultor de la Procuraduría ad hoc Anticorrupción para los casos Fujimori⁠-⁠Montesinos (2005⁠-⁠2008).
        - listitem [ref=f1e72]: Asesor legal en materia penal del Departamento Jurídico del rectorado de la Universidad Nacional Mayor de San Marcos (2004).
        - listitem [ref=f1e73]: Candidato a la Alcaldía de Lima por Alianza para el Progreso (2022).
      - heading "Formación académica" [level=2] [ref=f1e77]
      - list [ref=f1e80]:
        - listitem [ref=f1e81]: Estudios de Derecho en la Universidad Inca Garcilaso de la Vega.
        - listitem [ref=f1e82]: Grado de bachiller en Derecho (1995), con tesis titulada «Reformas necesarias al delito de asesinato en el Código Penal peruano».
        - listitem [ref=f1e83]: Título profesional de abogado (1996).
      - heading "Aportes destacados y publicaciones" [level=2] [ref=f1e87]
      - list [ref=f1e90]:
        - listitem [ref=f1e91]: «Reformas necesarias al delito de asesinato en el Código Penal Peruano» (1995).
        - listitem [ref=f1e92]: "«Atrapando al fugitivo: memorias de la histórica extradición de Alberto Fujimori» (2008)."
        - listitem [ref=f1e93]: «La gran usurpación. Memorias de gobierno» (2016).
        - listitem [ref=f1e94]: Participación en tareas anticorrupción vinculadas a los casos Fujimori⁠-⁠Montesinos y en trabajo legislativo de reforma constitucional y control político.
        - listitem [ref=f1e95]: Ponente de la 2.ª Cumbre Global de Inteligencia + Estrategia 2025 de Goberna.
