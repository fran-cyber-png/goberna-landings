        - generic [ref=f4e20]:
          - generic [ref=f4e21]:
            - heading "Resumen ejecutivo" [level=2] [ref=f4e23]
            - paragraph [ref=f4e24]: Profesional en Gobierno y Relaciones Internacionales, con formación en la Escuela de Asuntos Internacionales y Públicos de la Universidad de Columbia y quince años de experiencia en el sector público colombiano. Su trayectoria comprende la gestión de crisis y el liderazgo de equipos en entornos complejos. Ha sido directora de Estudios Estratégicos del Ministerio de Defensa Nacional y asesora de la Dirección para la Ejecución de Gobierno y Áreas Estratégicas de la Presidencia de la República de Colombia. Ha participado en publicaciones del Departamento Nacional de Planeación sobre seguridad y consolidación de la paz. Es creadora de la metodología Brújula de Mando Estratégico, orientada al fortalecimiento del liderazgo corporativo e inspirada en principios de las Fuerzas Especiales.
          - generic [ref=f4e25]:
