        - heading "Resumen ejecutivo" [level=2] [ref=f4e39]
        - paragraph [ref=f4e41]: Fernando Cocho Pérez es funcionario MEC/CAM, analista de inteligencia, experto en metodología de inteligencia y docente universitario. De acuerdo con UNIR, cuenta con más de 30 años de experiencia docente en universidades públicas y privadas, nacionales e internacionales, en materias relacionadas con inteligencia, seguridad, ciberinteligencia, ciberterrorismo, narrativas y perfiles delictivos. Es fundador de H4dm Inteligencia y ha desarrollado labores de asesoramiento a instituciones, empresas y gobiernos. CEDEGYS destaca su participación en la formación de analistas de inteligencia, su investigación sobre riesgos para la seguridad nacional y amenazas híbridas, así como su colaboración en medios de comunicación.
