        - heading "Resumen ejecutivo" [level=2] [ref=f8e39]
        - paragraph [ref=f8e41]: Daniela Galvan cuenta con más de 14 años de experiencia en investigación criminal e inteligencia digital. Su trayectoria combina la investigación en entornos digitales con el diseño e implementación de iniciativas de formación, desarrollo profesional y transferencia de conocimiento. Actualmente se desempeña en la Dirección General de Cibercrimen de la Policía Federal Argentina, donde coordina iniciativas de formación vinculadas a la investigación digital, la prevención del ciberdelito y el fortalecimiento de competencias especializadas. Ha participado en investigaciones sobre narcotráfico, trata de personas, secuestros, estafas y ciberdelitos, incorporando nuevas tecnologías y metodologías de análisis.
